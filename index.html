    <!-- ============================================================
         🔒 SECURITY — DevTools Block (Production Only)
         ============================================================ -->
    <script>
      (function () {
        // ✅ Skip on localhost / dev environments
        var hostname = window.location.hostname;
        var isDev =
          hostname === 'localhost' ||
          hostname === '127.0.0.1' ||
          hostname === '0.0.0.0' ||
          hostname.endsWith('.local') ||
          hostname.startsWith('192.168.') ||
          hostname.startsWith('10.') ||
          hostname.includes('vercel.app') || // preview deploys
          hostname.includes('netlify.app'); // preview deploys

        if (isDev) return;

        // ============================================================
        // 1. DISABLE RIGHT-CLICK
        // ============================================================
        document.addEventListener('contextmenu', function (e) {
          e.preventDefault();
          return false;
        });

        // ============================================================
        // 2. DISABLE DEVTOOLS SHORTCUTS
        // ============================================================
        document.addEventListener(
          'keydown',
          function (e) {
            // F12
            if (e.keyCode === 123 || e.key === 'F12') {
              e.preventDefault();
              e.stopPropagation();
              return false;
            }

            // Ctrl + Shift + I / J / C (Windows/Linux)
            if (
              e.ctrlKey &&
              e.shiftKey &&
              (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)
            ) {
              e.preventDefault();
              e.stopPropagation();
              return false;
            }

            // Ctrl + U (View Source)
            if (e.ctrlKey && (e.keyCode === 85 || e.key === 'u' || e.key === 'U')) {
              e.preventDefault();
              e.stopPropagation();
              return false;
            }

            // Ctrl + S (Save Page)
            if (e.ctrlKey && (e.keyCode === 83 || e.key === 's' || e.key === 'S')) {
              e.preventDefault();
              e.stopPropagation();
              return false;
            }

            // Ctrl + Shift + K (Firefox console)
            if (e.ctrlKey && e.shiftKey && e.keyCode === 75) {
              e.preventDefault();
              return false;
            }

            // Cmd + Option + I / J / C (Mac)
            if (
              e.metaKey &&
              e.altKey &&
              (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)
            ) {
              e.preventDefault();
              return false;
            }

            // Cmd + U (Mac view source)
            if (e.metaKey && (e.keyCode === 85 || e.key === 'u' || e.key === 'U')) {
              e.preventDefault();
              return false;
            }

            // Cmd + S (Mac save)
            if (e.metaKey && (e.keyCode === 83 || e.key === 's' || e.key === 'S')) {
              e.preventDefault();
              return false;
            }
          },
          true
        );

        // ============================================================
        // 3. DISABLE DRAG (prevents image/code dragging)
        // ============================================================
        document.addEventListener('dragstart', function (e) {
          e.preventDefault();
          return false;
        });

        // ============================================================
        // 4. DISABLE TEXT SELECTION (Optional — comment if unwanted)
        // ============================================================
        // ⚠️ This makes copy/paste impossible — may hurt UX
        // document.addEventListener('selectstart', function (e) {
        //   e.preventDefault();
        //   return false;
        // });

        // ============================================================
        // 5. CLEAR CONSOLE PERIODICALLY (hides console output)
        // ============================================================
        if (typeof console !== 'undefined') {
          setInterval(function () {
            try {
              console.clear();
            } catch (err) {
              /* silent */
            }
          }, 2000);
        }

        // ============================================================
        // 6. DEVTOOLS SIZE DETECTION (aggressive)
        // ============================================================
        // ⚠️ This can false-positive if browser UI changes
        // ⚠️ Enable only if you really want aggressive detection
        /*
        var devtoolsOpen = false;
        var threshold = 160;

        setInterval(function () {
          var widthDiff = window.outerWidth - window.innerWidth;
          var heightDiff = window.outerHeight - window.innerHeight;

          if (widthDiff > threshold || heightDiff > threshold) {
            if (!devtoolsOpen) {
              devtoolsOpen = true;
              // Options:
              // 1. Blank the page
              // document.body.innerHTML = '<div style="padding:50px;font-family:sans-serif;text-align:center;"><h1>⚠️ Access Restricted</h1><p>Please close developer tools to continue.</p></div>';
              // 2. Redirect
              // window.location.href = 'about:blank';
            }
          } else {
            devtoolsOpen = false;
          }
        }, 800);
        */
      })();
    </script>

    <!-- ============================================================
         ROOT + APP ENTRY

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- ============================================================
         LOADING FALLBACK (shown before React hydrates)
         ============================================================ -->
    <div
      id="initial-loader"
      style="
        position: fixed;
        inset: 0;
        background: #fffdf7;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.3s ease;
      "
    >
      <div
        style="
          width: 48px;
          height: 48px;
          border: 4px solid #0f766e;
          border-top-color: transparent;
          border-radius: 50%;
          animation: initial-spin 0.8s linear infinite;
        "
      ></div>
      <style>
        @keyframes initial-spin {
          to {
            transform: rotate(360deg);
          }
        }
      </style>
    </div>

    <script>
      // ✅ Remove initial loader once React mounts
      window.addEventListener('load', function () {
        setTimeout(function () {
          var loader = document.getElementById('initial-loader');
          if (loader) {
            loader.style.opacity = '0';
            setTimeout(function () {
              if (loader.parentNode) loader.parentNode.removeChild(loader);
            }, 300);
          }
        }, 500);
      });
    </script>
